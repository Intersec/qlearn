[package]
name = "qlearn"
description = "A course on a code base, in the browser, taught by an agent in a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
hex = "0.4"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }

[dev-dependencies]
# The tests embed the interface as a release does, rather than read it from
# disk, so they check what a release carries.
rust-embed = { version = "8", features = ["debug-embed"] }
tempfile = "3"
