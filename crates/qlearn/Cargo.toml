[package]
name = "qlearn"
description = "A course on a code base, in the browser, taught by an agent in a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
getrandom = "0.3"
hex = "0.4"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
# The tests embed the interface as a release does, rather than read it from
# disk, so they check what a release carries.
rust-embed = { version = "8", features = ["debug-embed"] }
tempfile = "3"
# The clock of the tests is paused and moved forward: a presence of 30
# minutes is tested in no time.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
