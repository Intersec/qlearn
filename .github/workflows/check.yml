# The gate, on every push to main and on every pull request.
#
# `make check` is the command that a developer runs before a commit: eslint,
# prettier, vitest, the interface build, cargo fmt, clippy, the tests, the
# release build, and the browser tests. One command, so the pipeline and the
# machine of the developer cannot drift apart.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A release commit is pushed with its tag, and the release workflow runs
    # this same gate before it publishes. Two runs on one commit cost twice
    # the time, and give a flaky test two chances to stop a release.
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'chore(release): v')

    steps:
      - uses: actions/checkout@v4

      # `.tool-versions` is the one place that names the versions. The
      # pipeline reads it, so asdf and the pipeline cannot drift apart.
      - name: Read the pinned versions
        id: tools
        run: |
          {
            echo "node=$(awk '/^nodejs /{print $2}' .tool-versions)"
            echo "rust=$(awk '/^rust /{print $2}' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the pinned Rust
        run: |
          rustup toolchain install '${{ steps.tools.outputs.rust }}' \
            --profile minimal --component clippy,rustfmt
          rustup default '${{ steps.tools.outputs.rust }}'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the interface dependencies
        run: make setup

      # The runner carries Google Chrome, which the browser tests drive.
      # Playwright downloads nothing.
      - name: The gate
        run: make check
